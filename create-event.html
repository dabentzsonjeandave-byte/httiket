<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HTTiket - Créer un événement</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #3B1464;
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .box {
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      color: #3B1464;
      margin-bottom: 10px;
      font-size: 32px;
    }

    .intro {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #3B1464;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* =========================
       UPLOAD IMAGE
    ========================= */

    .upload {
      border: 2px dashed #bbb;
      padding: 25px;
      text-align: center;
      border-radius: 10px;
      background: #fafafa;
    }

    .upload p {
      color: #777;
      margin-bottom: 15px;
    }

    .preview {
      display: none;
      margin-top: 20px;
    }

    .preview img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .preview-text {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }

    /* =========================
       BUTTON
    ========================= */

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #F58220;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #f5f0fa;
      color: #3B1464;
      border-radius: 10px;
      line-height: 1.7;
    }

    .success-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 15px 20px;
      }

      .logo {
        font-size: 24px;
      }

      .container {
        margin: 25px auto;
      }

      .box {
        padding: 25px 20px;
      }

      h1 {
        font-size: 27px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }

    }
  </style>
</head>


<body>


  <!-- HEADER -->

  <header>

    <div class="logo">
      HTTiket
    </div>

    <a href="/">
      ← Accueil
    </a>

  </header>


  <!-- CONTAINER -->

  <div class="container">

    <div class="box">

      <h1>
        Créer un événement
      </h1>

      <p class="intro">
        Publiez votre événement sur HTTiket et permettez à vos participants
        d'acheter leurs billets facilement.
      </p>


      <!-- FORM -->

      <form id="eventForm">


        <!-- IMAGE -->

        <div class="form-group">

          <label for="affiche">
            Affiche de l'événement
          </label>

          <div class="upload">

            <p>
              Ajoutez une image ou une affiche pour votre événement
            </p>

            <input
              type="file"
              id="affiche"
              accept="image/*"
              required
            >

            <div
              class="preview"
              id="preview"
            >

              <img
                id="previewImage"
                alt="Aperçu de l'affiche"
              >

              <div
                class="preview-text"
                id="previewText"
              ></div>

            </div>

          </div>

        </div>


        <!-- NOM -->

        <div class="form-group">

          <label for="nom">
            Nom de l'événement
          </label>

          <input
            type="text"
            id="nom"
            placeholder="Ex : Grande soirée HTTiket"
            required
          >

        </div>


        <!-- DATE + HEURE -->

        <div class="row">

          <div class="form-group">

            <label for="date">
              Date
            </label>

            <input
              type="date"
              id="date"
              required
            >

          </div>


          <div class="form-group">

            <label for="heure">
              Heure
            </label>

            <input
              type="time"
              id="heure"
              required
            >

          </div>

        </div>


        <!-- LIEU -->

        <div class="form-group">

          <label for="lieu">
            Lieu
          </label>

          <input
            type="text"
            id="lieu"
            placeholder="Ex : Port-au-Prince, Haïti"
            required
          >

        </div>


        <!-- PRIX + QUANTITE -->

        <div class="row">

          <div class="form-group">

            <label for="prix">
              Prix du billet (HTG)
            </label>

            <input
              type="number"
              id="prix"
              placeholder="Ex : 1500"
              min="0"
              required
            >

          </div>


          <div class="form-group">

            <label for="quantite">
              Nombre de billets
            </label>

            <input
              type="number"
              id="quantite"
              placeholder="Ex : 100"
              min="1"
              required
            >

          </div>

        </div>


        <!-- CATEGORIE -->

        <div class="form-group">

          <label for="categorie">
            Catégorie
          </label>

          <select
            id="categorie"
            required
          >

            <option value="">
              Sélectionnez une catégorie
            </option>

            <option value="Musique">
              Musique
            </option>

            <option value="Fêtes">
              Fêtes
            </option>

            <option value="Sport">
              Sport
            </option>

            <option value="Culture">
              Culture
            </option>

            <option value="Conférences">
              Conférences
            </option>

            <option value="Formation">
              Formation
            </option>

            <option value="Autres">
              Autres
            </option>

          </select>

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group">

          <label for="description">
            Description de l'événement
          </label>

          <textarea
            id="description"
            placeholder="Présentez votre événement..."
            required
          ></textarea>

        </div>


        <!-- BUTTON -->

        <button
          type="submit"
          class="btn"
        >
          Publier l'événement
        </button>


        <!-- MESSAGE -->

        <div
          class="message"
          id="message"
        ></div>


      </form>

    </div>

  </div>


  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const form =
      document.getElementById("eventForm");

    const message =
      document.getElementById("message");

    const affiche =
      document.getElementById("affiche");

    const preview =
      document.getElementById("preview");

    const previewImage =
      document.getElementById("previewImage");

    const previewText =
      document.getElementById("previewText");


    /* =========================
       PREVIEW IMAGE
    ========================= */

    affiche.addEventListener(
      "change",
      function() {

        const file =
          this.files[0];

        if (!file) {
          preview.style.display = "none";
          return;
        }

        if (!file.type.startsWith("image/")) {

          alert(
            "Veuillez sélectionner une image."
          );

          this.value = "";

          preview.style.display = "none";

          return;
        }

        const reader =
          new FileReader();

        reader.onload =
          function(event) {

            previewImage.src =
              event.target.result;

            previewText.textContent =
              file.name;

            preview.style.display =
              "block";

          };

        reader.readAsDataURL(file);

      }
    );


    /* =========================
       CREER EVENEMENT
    ========================= */

    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const file =
          affiche.files[0];

        const nom =
          document
            .getElementById("nom")
            .value
            .trim();

        const date =
          document
            .getElementById("date")
            .value;

        const heure =
          document
            .getElementById("heure")
            .value;

        const lieu =
          document
            .getElementById("lieu")
            .value
            .trim();

        const prix =
          document
            .getElementById("prix")
            .value;

        const quantite =
          document
            .getElementById("quantite")
            .value;

        const categorie =
          document
            .getElementById("categorie")
            .value;

        const description =
          document
            .getElementById("description")
            .value
            .trim();


        /* =========================
           IMAGE
        ========================= */

        if (!file) {

          alert(
            "Veuillez ajouter une affiche."
          );

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          function(event) {

            const eventData = {

              id:
                Date.now(),

              nom:
                nom,

              date:
                date,

              heure:
                heure,

              lieu:
                lieu,

              prix:
                Number(prix),

              quantite:
                Number(quantite),

              categorie:
                categorie,

              description:
                description,

              image:
                event.target.result

            };


            /* =========================
               RECUPERER EVENEMENTS
            ========================= */

            let events =
              JSON.parse(
                localStorage.getItem(
                  "httiketEvents"
                )
              ) || [];


            /* =========================
               AJOUTER EVENEMENT
            ========================= */

            events.push(eventData);


            /* =========================
               SAUVEGARDER
            ========================= */

            localStorage.setItem(
              "httiketEvents",
              JSON.stringify(events)
            );


            /* =========================
               MESSAGE
            ========================= */

            message.style.display =
              "block";

            message.innerHTML = `

              <div class="success-title">
                Événement publié avec succès !
              </div>

              Votre événement
              <strong>${escapeHTML(nom)}</strong>
              a été enregistré.

              <br><br>

              Date :
              ${escapeHTML(date)}

              <br>

              Heure :
              ${escapeHTML(heure)}

              <br>

              Lieu :
              ${escapeHTML(lieu)}

              <br>

              Prix :
              ${Number(prix).toLocaleString("fr-FR")}
              HTG

              <br>

              Billets :
              ${escapeHTML(quantite)}

              <br>

              Catégorie :
              ${escapeHTML(categorie)}

              <br><br>

              <a
                href="/"
                style="
                  display:inline-block;
                  background:#3B1464;
                  color:white;
                  padding:11px 17px;
                  border-radius:7px;
                  text-decoration:none;
                  font-weight:bold;
                "
              >
                Voir sur Accueil
              </a>

            `;


            /* =========================
               RESET FORM
            ========================= */

            form.reset();

            preview.style.display =
              "none";

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          };


        reader.readAsDataURL(file);

      }
    );


    /* =========================
       SECURITE TEXTE
    ========================= */

    function escapeHTML(text) {

      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>


</body>
</html>
